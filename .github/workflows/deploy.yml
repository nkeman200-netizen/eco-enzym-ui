name: Deploy Frontend to cPanel (Build & Transfer)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Sesuaikan dengan versi Node.js yang Anda gunakan
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build
        # Jika besok butuh VITE_API_URL, bisa ditambahkan di sini:
        # env:
        #   VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "cipressa.id.rapidplex.com"
          username: "sanitas1"
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: 64000
          source: "dist/"
          target: "/home/sanitas1/public_html"
          strip_components: 1
          
      - name: Deployment Success
        run: echo "Deployment Frontend Berhasil!"