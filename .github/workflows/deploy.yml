name: Deploy Frontend to cPanel (Build & Transfer)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Sesuaikan dengan versi Node.js yang Anda gunakan
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build
        # Jika besok butuh VITE_API_URL, bisa ditambahkan di sini:
        # env:
        #   VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to cPanel via SSH/Rsync
        env:
          SSH_PASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
          SSH_HOST: "cipressa.id.rapidplex.com"
          SSH_PORT: "64000"
          SSH_USER: "sanitas1"
          TARGET_DIR: "/home/sanitas1/public_html"
        run: |
          # 1. Pasang utility sshpass & rsync di GitHub Runner
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

          # 2. Transfer isi folder dist ke public_html menggunakan rsync
          # Catatan: Kita TIDAK menggunakan bendera --delete agar folder /backend tidak ikut terhapus
          sshpass -p "$SSH_PASS" rsync -avz -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" ./dist/ ${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/
          
          echo "Deployment Frontend Berhasil!"